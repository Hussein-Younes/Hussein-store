<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شحن المنتج - Hussein Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            Hussein<span>Store</span>
        </div>

        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="index.html">الألعاب</a>
            <a href="index.html">تطبيقات الشات</a>
            <a href="#">تتبع الطلب</a>
        </nav>

        <button class="login-btn">
            تسجيل الدخول
        </button>

    </header>


    <main class="product-page">

        <div class="product-box">

            <div class="product-image">

                <img
                    id="product-image"
                    src=""
                    alt=""
                >

            </div>


            <div class="product-info">

                <h1 id="product-name">
                    جاري التحميل...
                </h1>

                <p>
                    اختر الباقة التي تريد شحنها
                </p>


                <h3>الباقات</h3>

                <!-- JavaScript رح يحط الباقات هون -->

                <div
                    class="packages"
                    id="packages"
                ></div>


                <div class="input-group">

                    <label for="player-id">
                        Player ID
                    </label>

                    <input
                        type="text"
                        id="player-id"
                        placeholder="أدخل Player ID"
                    >

                </div>


                <div class="order-summary">

                    <div>

                        <span>الباقة:</span>

                        <strong id="selected-package">
                            لم يتم الاختيار
                        </strong>

                    </div>


                    <div>

                        <span>السعر:</span>

                        <strong id="selected-price">
                            0 SYP
                        </strong>

                    </div>

                </div>


                <button
                    class="main-btn order-btn"
                    onclick="submitOrder()"
                >
                    متابعة الطلب
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
